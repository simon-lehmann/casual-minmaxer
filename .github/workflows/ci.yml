name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted && luarocks install luacheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: luacheck CasualMinMaxer tests --no-color
      - run: busted --verbose tests/spec
      - run: python -m pytest -q pipeline/tests
      - name: Syntax-check generated data
        run: for f in CasualMinMaxer_Data/*.lua; do luac -p "$f"; done
      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: CasualMinMaxer-${{ github.ref_name }}
          path: dist/*.zip
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CasualMinMaxer-${{ github.ref_name }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
